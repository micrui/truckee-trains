name: amtrak-poll
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll and render
        run: |
          python3 amtrak_poll.py
          python3 render_status.py
      - name: Commit
        run: |
          git config user.name "truckee-trains poller"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/amtrak docs/status.html
          git pull --rebase --autostash -q || true
          git diff --cached --quiet || git commit -m "Zephyr log: $(date -u +'%F %H:%M')"
          git push
